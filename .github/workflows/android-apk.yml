name: Android APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: mobile

    env:
      EXPO_PUBLIC_API_URL: https://api-chrono-sport.enzo-palermo.com

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Install dependencies
        run: npm ci

      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew

      - name: Build release APK
        working-directory: mobile/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Prepare APK artifact
        run: cp android/app/build/outputs/apk/release/app-release.apk chrono-sport.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: chrono-sport-apk-${{ github.run_number }}
          path: mobile/chrono-sport.apk
          if-no-files-found: error
          retention-days: 14
